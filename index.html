<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <!-- Блок для кнопок «Войти/Регистрация» под комментариями -->
    <ul class="comments"></ul>
    <div id="auth-under-comments"></div>

    <div class="add-form" id="add-comment-form">
      <input type="text" class="add-form-name" placeholder="Ваше имя" readonly />
      <textarea class="add-form-text" placeholder="Напишите комментарий (минимум 3 символа)" rows="3"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Добавить комментарий</button>
      </div>
    </div>

    <div class="add-form-status"></div>
  </div>

  <!-- Модальное окно (обязательно перед </body>) -->
  <div id="auth-modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-window">
      <button id="close-auth-modal" class="close-btn" aria-label="Закрыть">&times;</button>
      <div id="auth-modal-content"></div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>

</html>
