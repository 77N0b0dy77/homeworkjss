<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments">
    </ul>
    <div class="add-form">
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Написать</button>
      </div>
    </div>
    <div class="add-form-status"></div>
  </div>

    <div class="add-form" style="display: none; margin-top: 20px; padding: 20px; background: #333;">
    <input type="text" class="add-form-name" placeholder="Ваше имя" style="width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 10px;" readonly>
    <textarea class="add-form-text" placeholder="Напишите комментарий (минимум 3 символа)" style="width: 100%; height: 80px; padding: 8px; box-sizing: border-box; margin-bottom: 10px;"></textarea>
    <button class="add-form-button" style="padding: 10px 20px; background: #2196F3; color: white; border: none; cursor: pointer;">Добавить комментарий</button>
  </div>
</body>

  <script type="module" src="./main.js"></script>
 
</html>
